[package]
name = "sss-server"
version = "0.1.0"
edition = "2024"

[dependencies]
#
# Logging
log = "^0.4"
env_logger = "^0.11"
#
# Internal deps
testing = { git = "https://github.com/a-givertzman/rust-testing.git", tag = "0.1.2" }
debugging = { git = "https://github.com/a-givertzman/rust-debuging.git", tag = "0.0.1" }
api-tools = { git = "https://github.com/a-givertzman/rust-api-tools.git", tag = "0.2.0" }
sal-core = { git = "https://github.com/a-givertzman/rust-sal-core.git", tag = "0.0.3" }
sal-sync = { git = "https://github.com/a-givertzman/rust-sal-sync.git", tag = "0.0.4" }
# sal-sync = { path = "../sal-sync" }
#
# Time
chrono = "^0.4"
#
# Serde
serde = { version = "^1.0", features = ["derive"] }
serde_yaml = "^0.9"
serde_json = "^1.0"
bincode = "^2.0"
#
# Regex
regex = "^1.10"
#
# Collections
indexmap = "^2.7"
rustc-hash = "^2.1"
coco = "^0.3"
dashmap = "^6.1"
#
# Math
splines = "^4.4"
#
# Helpful macros for working with enums and strings
strum_macros = "^0.27"
#
# Thread safe
kanal = "^0.1"
papaya = "^0.2"
